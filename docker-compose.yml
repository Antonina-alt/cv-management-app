services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cvapp
      POSTGRES_PASSWORD: cvapp
      POSTGRES_DB: cvapp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvapp"]
      interval: 5s
      timeout: 5s
      retries: 5
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite --blobHost 0.0.0.0 --loose"
    ports: ["10000:10000", "10001:10001", "10002:10002"]
    volumes: ["azurite:/data"]
volumes:
  pgdata:
  azurite:
